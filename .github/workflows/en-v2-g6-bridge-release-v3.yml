name: EN V2 G6 Bridge Release V3

on:
  push:
    branches:
      - elan-vps-bridge-control-v1
    paths:
      - '.github/workflows/en-v2-g6-bridge-release-v3.yml'
      - '.elan-vps-bridge/bootstrap/apply-g6-schema-read-v3-release.py'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elan-vps-bridge-control-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded G6 V3 release
        shell: bash
        run: |
          set -euo pipefail
          python .elan-vps-bridge/bootstrap/apply-g6-schema-read-v3-release.py
          python -m py_compile .elan-vps-bridge/bootstrap/issue_inbox.py .elan-vps-bridge/bootstrap/bridge_worker.py .elan-vps-bridge/bootstrap/command_port.py
          grep -q 'G6_SCHEMA_CONSTRAINTS_TEMPLATE = "en029_m6_schema_constraints_indexes_chunks_v2"' .elan-vps-bridge/bootstrap/command_port.py
          grep -q '"constraints_indexes": constraints_indexes' .elan-vps-bridge/bootstrap/command_port.py
      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .elan-vps-bridge/bootstrap/command_port.py .elan-vps-bridge/bootstrap/runtime-manifest.json
          git commit -m 'feat: publish EN2 G6 schema-read V3 bridge runtime'
          git push origin HEAD:elan-vps-bridge-control-v1
