name: EN-034 extract bootstrap components

on:
  push:
    branches:
      - en-034-bootstrap-v1.3.2
    paths:
      - .github/workflows/en-034-extract-bootstrap.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: en-034-bootstrap-v1.3.2
      - name: Verify and extract exact bootstrap components
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,pathlib,stat,tarfile,zipfile
          root=pathlib.Path('_en034/bootstrap')
          source=root/'en-034-m1-v1.3.2.zip'
          expected_sha='c2afc1a1ed854690392278115b4febb0b2d5f93885b5447438d16f141c0fc471'
          assert hashlib.sha256(source.read_bytes()).hexdigest()==expected_sha
          version='1.3.2';commit='2bcc2fc7f6c35b47d037447e0ebc453d76893cfe';stem=f'elan-vps-v{version}'
          expected={f'{stem}-package.tar.gz',f'{stem}-package.tar.gz.sha256',f'{stem}-distribution-manifest.json',f'{stem}-image.tar',f'{stem}-image.tar.sha256',f'{stem}-image-identity.json'}
          with zipfile.ZipFile(source) as z:
              infos=z.infolist();assert {i.filename for i in infos}==expected and len(infos)==len(expected)
              for item in infos:
                  mode=item.external_attr>>16
                  assert not item.is_dir() and not item.flag_bits&1 and '/' not in item.filename
                  assert not mode or stat.S_IFMT(mode) in {0,stat.S_IFREG}
              files={name:z.read(name) for name in expected}
          package=files[f'{stem}-package.tar.gz']
          assert files[f'{stem}-package.tar.gz.sha256'].decode().split()[0]==hashlib.sha256(package).hexdigest()
          manifest=json.loads(files[f'{stem}-distribution-manifest.json'])
          assert manifest['version']==version and manifest['source_commit']==commit and manifest['verdict']=='PASS'
          members={}
          with tarfile.open(fileobj=io.BytesIO(package),mode='r:gz') as t:
              for member in t.getmembers():
                  pure=pathlib.PurePosixPath(member.name);assert not pure.is_absolute() and '..' not in pure.parts
                  if member.isfile():
                      f=t.extractfile(member);assert f is not None;members[member.name]=f.read()
                  else: assert member.isdir()
          assert json.loads(members['observer/v1.3.0/distribution-manifest.json'])==manifest
          release=members['observer/v1.3.0/release-manifest.json']
          assert hashlib.sha256(release).hexdigest()==manifest['release_manifest_sha256']
          broker_path='observer/v1.3.0/actions/elan-vps-v1-broker';broker=members[broker_path];spec=manifest['files'][broker_path]
          assert len(broker)==spec['size_bytes'] and hashlib.sha256(broker).hexdigest()==spec['sha256']
          out=root/'components';out.mkdir(parents=True,exist_ok=True)
          (out/'elan-vps-v1-broker').write_bytes(broker)
          (out/'release-manifest.json').write_bytes(release)
          unit='''[Unit]\nDescription=EN-034 restore original V1.3.1 policy before V1.3.2 build\n\n[Service]\nType=oneshot\nExecStart=/usr/bin/install -m 600 /var/lib/elan-vps-v1/rollback-v1.3.2/policy.json /etc/elan-vps-v1/policy.json\nExecStartPost=/usr/bin/rm -f /etc/systemd/system/elan-vps-v1-en034-restore-policy.service\n'''
          (out/'elan-vps-v1-en034-restore-policy.service').write_text(unit)
          assert hashlib.sha256(broker).hexdigest()=='6bdf4746b3b5011bb980dfee650d88466adb96484643fd0729a2f49d844afd8b'
          assert hashlib.sha256(release).hexdigest()=='cf9283f62873e4950f65490446586b6651dee10483e4f000df5c7e0dec3bf410'
          assert hashlib.sha256(unit.encode()).hexdigest()=='b0e189cbe784654e6235255b18e040d6224558727fef164f221e5c913b2665e8'
          PY
      - name: Commit exact components
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _en034/bootstrap/components
          git commit -m 'chore(en-034): expose verified bootstrap components'
          git push origin HEAD:en-034-bootstrap-v1.3.2
