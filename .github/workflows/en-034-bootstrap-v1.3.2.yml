name: EN-034 bootstrap relay

on:
  push:
    branches:
      - en-034-bootstrap-v1.3.2
    paths:
      - .github/workflows/en-034-bootstrap-v1.3.2.yml

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: en-034-bootstrap-v1.3.2
      - name: Download and verify qualified artifact
        env:
          ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-2248-81f4-a931-799f971e34e8/raw?se=2026-07-27T20:04:07Z&sp=r&sv=2026-02-06&sr=b&scid=ef0b47fd-3b1d-57f3-b05e-8f28f6713aab&skoid=0a4a0f0c-99ac-4752-9d87-cfac036fa93f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-27T18:08:56Z&ske=2026-07-29T18:08:56Z&sks=b&skv=2026-02-06&sig=St0yS0R0fCTX8xfXe3kqFN%2BiL7%2BA1S5gy3yaeudHyIc%3D'
          EXPECTED_SHA256: c2afc1a1ed854690392278115b4febb0b2d5f93885b5447438d16f141c0fc471
          EXPECTED_SIZE: '60064784'
        run: |
          set -euo pipefail
          mkdir -p _en034/bootstrap
          curl --fail --location --retry 3 --retry-all-errors "$ARTIFACT_URL" -o _en034/bootstrap/en-034-m1-v1.3.2.zip
          test "$(stat -c %s _en034/bootstrap/en-034-m1-v1.3.2.zip)" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  _en034/bootstrap/en-034-m1-v1.3.2.zip" | sha256sum --check --strict
      - name: Commit relay artifact
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _en034/bootstrap/en-034-m1-v1.3.2.zip
          git commit -m 'chore(en-034): relay corrected qualified v1.3.2 artifact'
          git push origin HEAD:en-034-bootstrap-v1.3.2
