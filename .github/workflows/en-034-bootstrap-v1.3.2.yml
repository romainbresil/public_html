name: EN-034 bootstrap relay

on:
  push:
    branches:
      - en-034-bootstrap-v1.3.2
    paths:
      - .github/workflows/en-034-bootstrap-v1.3.2.yml

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: en-034-bootstrap-v1.3.2
      - name: Download and verify qualified artifact
        env:
          ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-e020-81f4-8a89-e0f2e7288045/raw?se=2026-07-27T19:55:34Z&sp=r&sv=2026-02-06&sr=b&scid=ab820002-b709-5047-80a4-2afc9239f2f3&skoid=0a4a0f0c-99ac-4752-9d87-cfac036fa93f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-27T18:06:17Z&ske=2026-07-29T18:06:17Z&sks=b&skv=2026-02-06&sig=56Wg1SOcGh3mQy%2BXBtQZ4r8DLumByp7NLPXX%2BG6TCRo%3D'
          EXPECTED_SHA256: a8334b3e10e2f754838bfda629312641f1294d08015a64ce63b3c29b28bce185
        run: |
          set -euo pipefail
          mkdir -p _en034/bootstrap
          curl --fail --location --retry 3 --retry-all-errors "$ARTIFACT_URL" -o _en034/bootstrap/en-034-m1-v1.3.2.zip
          echo "$EXPECTED_SHA256  _en034/bootstrap/en-034-m1-v1.3.2.zip" | sha256sum --check --strict
      - name: Commit relay artifact
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _en034/bootstrap/en-034-m1-v1.3.2.zip
          git commit -m 'chore(en-034): relay qualified v1.3.2 artifact'
          git push origin HEAD:en-034-bootstrap-v1.3.2
