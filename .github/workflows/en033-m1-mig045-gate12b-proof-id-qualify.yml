name: EN033 MIG045 Gate12B Proof ID Qualification

on:
  push:
    branches:
      - en033-m1-mig045-gate12b-durable-proof-2026-09-04
    paths:
      - '.elan-vps-bridge/bootstrap/**'
      - '.github/workflows/en033-m1-mig045-gate12b-proof-id-qualify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize final A-B Gate12B bridge binding
        run: |
          set -euo pipefail
          python3 .elan-vps-bridge/bootstrap/apply-mig045-gate12b-proof-id-release.py
          python3 .elan-vps-bridge/bootstrap/apply-mig045-gate12b-v3-test-fixtures.py
      - name: Compile runtime
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .elan-vps-bridge/bootstrap/issue_inbox.py \
            .elan-vps-bridge/bootstrap/bridge_worker.py \
            .elan-vps-bridge/bootstrap/command_port.py
      - name: Gate12B A-B final binding delta
        run: |
          set -euo pipefail
          python3 .elan-vps-bridge/bootstrap/test_mig045_gate12b_a_b_final_binding.py
      - name: Gate12B canonical proof contract
        run: |
          set -euo pipefail
          python3 .elan-vps-bridge/bootstrap/test_mig045_gate12b_committed_proof.py
      - name: Existing bridge regressions
        run: |
          set -euo pipefail
          python3 .elan-vps-bridge/bootstrap/test_issue_inbox_polling.py
          python3 .elan-vps-bridge/bootstrap/test_p1_migration_registry_read.py
          python3 .elan-vps-bridge/bootstrap/test_schema_migration_membership_projection.py
          python3 .elan-vps-bridge/bootstrap/test_mig045_v1351_rollout_fresh_read.py
      - name: Runtime manifest exact bytes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('.elan-vps-bridge/bootstrap')
          manifest_path = root / 'runtime-manifest.json'
          manifest_raw = manifest_path.read_bytes()
          manifest = json.loads(manifest_raw.decode('utf-8'))
          assert manifest['schema_version'] == '1.0'
          assert manifest['release_id'] == 'bridge-mig045-gate12b-a-b-final-binding-20260905-v3'
          assert set(manifest['files']) == {'issue_inbox.py', 'bridge_worker.py', 'command_port.py'}
          for name, entry in manifest['files'].items():
              raw = (root / name).read_bytes()
              observed = hashlib.sha256(raw).hexdigest()
              assert observed == entry['sha256'], (name, observed, entry['sha256'])
              print(f'{name} {observed}')
          print('RUNTIME_MANIFEST_SHA256', hashlib.sha256(manifest_raw).hexdigest())
          print('RUNTIME_MANIFEST_EXACT_PASS')
          PY
      - name: BRIDGE_SELF_UPDATE contract on temporary runtime
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, tempfile, sys
          root = pathlib.Path('.elan-vps-bridge/bootstrap').resolve()
          sys.path.insert(0, str(root))
          import issue_inbox
          manifest_path = root / 'runtime-manifest.json'
          manifest_raw = manifest_path.read_bytes()
          manifest_sha = hashlib.sha256(manifest_raw).hexdigest()
          payloads = {
              issue_inbox.SELF_UPDATE_MANIFEST_PATH: manifest_raw,
              **{
                  f'{issue_inbox.SELF_UPDATE_BASE_PATH}/{name}': (root / name).read_bytes()
                  for name in issue_inbox.SELF_UPDATE_RUNTIME_FILES
              },
          }
          with tempfile.TemporaryDirectory() as tmp:
              tmp = pathlib.Path(tmp)
              app_root = tmp / 'app'
              state_root = tmp / 'state'
              app_root.mkdir()
              for name in issue_inbox.SELF_UPDATE_RUNTIME_FILES:
                  (app_root / name).write_bytes((root / name).read_bytes())
              result = issue_inbox.apply_self_update(
                  state_root,
                  app_root,
                  manifest_sha,
                  fetch_fn=lambda path: payloads[path],
              )
              assert result['status'] == 'ALREADY_CURRENT', result
              assert result['manifest_sha256'] == manifest_sha
              assert result['updated_files'] == []
              assert result['restart_after_post'] is False
              assert result['external_action_allowed'] is False
          print('BRIDGE_SELF_UPDATE_TEMP_PASS', manifest_sha)
          PY
      - name: Commit qualified runtime to reserved branch
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            .elan-vps-bridge/bootstrap/issue_inbox.py \
            .elan-vps-bridge/bootstrap/command_port.py \
            .elan-vps-bridge/bootstrap/runtime-manifest.json \
            .elan-vps-bridge/bootstrap/test_mig045_gate12b_committed_proof.py; then
            echo 'QUALIFIED_RUNTIME_ALREADY_COMMITTED'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .elan-vps-bridge/bootstrap/issue_inbox.py \
            .elan-vps-bridge/bootstrap/command_port.py \
            .elan-vps-bridge/bootstrap/runtime-manifest.json \
            .elan-vps-bridge/bootstrap/test_mig045_gate12b_committed_proof.py
          git commit -m 'feat: integrate MIG045 Gate12B final A-B owners'
          git push origin HEAD:en033-m1-mig045-gate12b-durable-proof-2026-09-04

# gate12b-a-b-final-binding-fresh-readback
