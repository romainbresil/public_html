name: MIG045 Gate12B broker marker runtime repair

on:
  push:
    branches:
      - en033-m1-mig045-gate12b-broker-marker-runtime-repair-2026-09-06
    paths:
      - '.github/workflows/mig045-gate12b-broker-marker-runtime-repair.yml'
      - '.elan-vps-bridge/bootstrap/command_port.py'
      - '.elan-vps-bridge/bootstrap/issue_inbox.py'
      - '.elan-vps-bridge/bootstrap/bridge_worker.py'
      - '.elan-vps-bridge/bootstrap/runtime-manifest.json'
      - '.elan-vps-bridge/bootstrap/test_mig045_gate12b_broker_marker_runtime_repair.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mig045-gate12b-broker-marker-runtime-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Runtime byte identities
        run: |
          sha256sum .elan-vps-bridge/bootstrap/command_port.py
          sha256sum .elan-vps-bridge/bootstrap/issue_inbox.py
          sha256sum .elan-vps-bridge/bootstrap/bridge_worker.py
          sha256sum .elan-vps-bridge/bootstrap/runtime-manifest.json
      - name: Runtime repair contract
        run: python3 .elan-vps-bridge/bootstrap/test_mig045_gate12b_broker_marker_runtime_repair.py -v
      - name: Recover qualified previous runtime
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin f5bd3bb570c482a82604ae6d5d97b9f87c7891cc
          git show f5bd3bb570c482a82604ae6d5d97b9f87c7891cc:.elan-vps-bridge/bootstrap/command_port.py > /tmp/gate12b-previous-command-port.py
          git show f5bd3bb570c482a82604ae6d5d97b9f87c7891cc:.elan-vps-bridge/bootstrap/runtime-manifest.json > /tmp/gate12b-previous-runtime-manifest.json
          test "$(sha256sum /tmp/gate12b-previous-command-port.py | awk '{print $1}')" = "1172320da0eb1389c21cced7c67ba543c82520e723d3533d136e23540a955003"
      - name: Inherited Bridge non-regression at qualified base
        run: |
          set -euo pipefail
          cp .elan-vps-bridge/bootstrap/command_port.py /tmp/gate12b-new-command-port.py
          cp .elan-vps-bridge/bootstrap/runtime-manifest.json /tmp/gate12b-new-runtime-manifest.json
          cp /tmp/gate12b-previous-command-port.py .elan-vps-bridge/bootstrap/command_port.py
          cp /tmp/gate12b-previous-runtime-manifest.json .elan-vps-bridge/bootstrap/runtime-manifest.json
          for test_file in .elan-vps-bridge/bootstrap/test_*.py; do
            if [ "$(basename "$test_file")" = "test_mig045_gate12b_broker_marker_runtime_repair.py" ]; then
              continue
            fi
            python3 "$test_file" -v
          done
          cp /tmp/gate12b-new-command-port.py .elan-vps-bridge/bootstrap/command_port.py
          cp /tmp/gate12b-new-runtime-manifest.json .elan-vps-bridge/bootstrap/runtime-manifest.json
      - name: Wrapper compile and bounded contract
        env:
          ELAN_BRIDGE_PREVIOUS_COMMAND_PORT: /tmp/gate12b-previous-command-port.py
        run: |
          set -euo pipefail
          python3 -m py_compile .elan-vps-bridge/bootstrap/command_port.py .elan-vps-bridge/bootstrap/issue_inbox.py .elan-vps-bridge/bootstrap/bridge_worker.py
          python3 - <<'PY'
          import importlib.util, pathlib
          path=pathlib.Path('.elan-vps-bridge/bootstrap/command_port.py')
          spec=importlib.util.spec_from_file_location('gate12b_runtime_repair',path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          transient=module._transient_broker_wrapper_text()
          compile(transient,'<gate12b-transient-broker>','exec')
          assert len(transient.encode('utf-8')) < 180000
          assert 'schema_migration_exact_membership_v1' in transient
          assert 'commit_mig045_gate12b_proof_v1' not in transient
          print('TRANSIENT_BROKER_WRAPPER_BYTES='+str(len(transient.encode('utf-8'))))
          PY
      - name: Manifest exactness
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('.elan-vps-bridge/bootstrap')
          manifest=json.loads((root/'runtime-manifest.json').read_text())
          assert manifest['release_id']=='bridge-mig045-gate12b-broker-marker-runtime-repair-20260906-v1'
          for name,spec in manifest['files'].items():
              assert hashlib.sha256((pathlib.Path(spec['path'])).read_bytes()).hexdigest()==spec['sha256']
          print('MIG045_GATE12B_BROKER_MARKER_RUNTIME_REPAIR=PASS')
          PY
