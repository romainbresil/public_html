name: Elan VPS Bridge Release Verify

on:
  push:
    branches:
      - elan-vps-bridge-control-v1
    paths:
      - ".elan-vps-bridge/bootstrap/**"
      - ".elan-vps-bridge/packages/**"
      - ".github/workflows/elan-vps-bridge-release-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify runtime syntax, polling contract, and package hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .elan-vps-bridge/bootstrap/issue_inbox.py \
            .elan-vps-bridge/bootstrap/bridge_worker.py \
            .elan-vps-bridge/bootstrap/command_port.py
          python3 .elan-vps-bridge/bootstrap/test_issue_inbox_polling.py
          test "$(sha256sum .elan-vps-bridge/packages/en2-g5/20260903_en2_g5_001_knowledge_observation_capture.sql | awk '{print $1}')" = "9ba6de679ef3dd5382b7a0b2b5b3d6dada0dac0d5f6cabe3ad50e2739d4ec236"
          test "$(sha256sum .elan-vps-bridge/packages/en2-g5/20260903_en2_g5_001_knowledge_observation_capture.rollback.sql | awk '{print $1}')" = "4a5823e4dd95d61f3b92b47cbcefaa72184a751d00fcd724ca3f572f62eaecb8"
          echo "BRIDGE_RUNTIME_SHA256_BEGIN"
          sha256sum \
            .elan-vps-bridge/bootstrap/issue_inbox.py \
            .elan-vps-bridge/bootstrap/bridge_worker.py \
            .elan-vps-bridge/bootstrap/command_port.py
          echo "BRIDGE_RUNTIME_SHA256_END"
          echo "EN2_G5_PUBLIC_PACKAGE_VALID"
